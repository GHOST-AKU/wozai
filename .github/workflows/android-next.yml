name: Verify 我在next experiment
on:
  pull_request:
    paths:
      - 'app-next/**'
      - 'app/src/main/**'
      - 'third_party/noise-java/**'
      - 'mesh/**'
      - 'tools/package-android-mesh.py'
      - 'i18n/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-next.yml'
  workflow_dispatch:
    inputs:
      signed:
        description: Build a persistent-certificate installation APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compose-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh
      - name: Build input-bound Android Mesh core
        run: |
          sdkmanager 'ndk;27.2.12479018'
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash mesh/tools/build-android-core.sh
          python3 tools/package-android-mesh.py --record-build
          python3 -m unittest discover -s tools/tests -p 'test_mesh_android_package.py' -v
      - run: ./gradlew --no-daemon :app-next:testDebugUnitTest :app-next:assembleDebug :app-next:lintDebug
        if: ${{ !inputs.signed }}
      - name: Build verified installation APK
        if: ${{ inputs.signed }}
        env:
          WOZAI_ANDROID_KEYSTORE_BASE64: ${{ secrets.WOZAI_ANDROID_KEYSTORE_BASE64 }}
          WOZAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WOZAI_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app-next:testDebugUnitTest
          python3 tools/build-signed-next.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-next-verification
          path: |
            build/android-next-signed/
            mesh/target/android-core-build.json
            app-next/build/reports/tests/
            app-next/build/reports/lint-results-debug.*
            app-next/build/reports/next-screenshots/
          if-no-files-found: ignore
