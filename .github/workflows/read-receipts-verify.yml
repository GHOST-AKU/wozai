name: Verify read receipt implementation
on:
  push:
    branches: [feat/read-receipts]
    paths: ['apple/**', 'app/**', 'desktop/**', 'tests/**', 'tools/test-read-receipt-interop.sh', '.github/workflows/read-receipts-verify.yml']
permissions:
  contents: read
jobs:
  apple:
    if: ${{ !contains(github.event.head_commit.message, '[apple-ui]') }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compare already verified native inputs
        id: source
        run: |
          if git diff --quiet 369357888ee074a6d7d49e09af690594c7a9336c HEAD -- apple/Sources apple/App apple/NearbyIM.xcodeproj apple/Tests/WozaiCoreTests; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Reuse native core/macOS/iOS build results for identical inputs from run 40836512497.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Native core and privacy regression
        if: steps.source.outputs.changed == 'true'
        run: |
          python3 tools/version.py --check
          python3 tools/validate-apple-localizations.py
          swift test --package-path apple
      - name: Compile macOS and iOS native views
        if: steps.source.outputs.changed == 'true'
        run: |
          xcodebuild -project apple/NearbyIM.xcodeproj -scheme NearbyIM -destination 'platform=macOS' -configuration Debug -derivedDataPath build/read-mac CODE_SIGNING_ALLOWED=NO build > build-read-mac.log 2>&1 || { tail -100 build-read-mac.log; exit 1; }
          xcodebuild -project apple/NearbyIM.xcodeproj -scheme NearbyIM -destination 'generic/platform=iOS' -configuration Debug -derivedDataPath build/read-ios CODE_SIGNING_ALLOWED=NO build > build-read-ios.log 2>&1 || { tail -100 build-read-ios.log; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Production Java and Swift protocol interoperability
        run: |
          bash tools/test-apple-interop.sh
          bash tools/test-read-receipt-interop.sh --compiled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-receipts-apple-compile
          path: |
            build-read-*.log
            build/apple-interop/*.log
  android-build:
    if: github.repository == 'GHOST-AKU/wozai' && github.ref == 'refs/heads/feat/read-receipts' && !contains(github.event.head_commit.message, '[apple-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Targeted protocol and privacy checks
        run: |
          sh tools/check-source.sh
          mkdir -p build/core-tests
          find third_party/noise-java/src app/src/main/java/dev/ghost/nearbyim/noise -name '*.java' > build/core-tests/crypto-sources.txt
          javac -encoding UTF-8 -d build/core-tests @build/core-tests/crypto-sources.txt app/src/main/java/dev/ghost/nearbyim/core/*.java app/src/main/java/dev/ghost/nearbyim/i18n/UiText.java app/src/main/java/dev/ghost/nearbyim/i18n/LocalizedIllegalArgumentException.java app/src/main/java/dev/ghost/nearbyim/GalleryExportNames.java tests/*.java
          for test in CoreTests AuthenticationTests SecureSessionTests ProtocolV4Tests ReadReceiptTests ReadVisibilityTests ReadReceiptSecurityTests TextCapacityTests FairRecordWriterTests; do
            java -cp build/core-tests dev.ghost.nearbyim.core.$test
          done
          sh tools/test-text-legacy.sh
      - name: Build and verify the original-certificate preview
        env:
          WOZAI_ANDROID_KEYSTORE_BASE64: ${{ secrets.WOZAI_ANDROID_KEYSTORE_BASE64 }}
          WOZAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WOZAI_ANDROID_KEYSTORE_PASSWORD }}
          WOZAI_ANDROID_CANDIDATE_ONLY: 'true'
        run: python3 tools/build-signed-android.py --preview
      - uses: actions/upload-artifact@v4
        with:
          name: android-fixed-signature-preview
          path: |
            build/signing-upgrade/candidate.apk
            build/signing-upgrade/signature.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-read-receipts-native-fixtures
          path: |
            build/signing-upgrade/candidate.apk
            build/signing-upgrade/native-test.apk
          if-no-files-found: error
  android-native:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            profile: pixel_2
            night: 'no'
          - api: 34
            profile: pixel_c
            night: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: INTERNAL-read-receipts-native-fixtures
          path: build/signing-upgrade
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native receipt privacy, viewport and regression checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell cmd uimode night ${{ matrix.night }}
            ANDROID_APP_APK=build/signing-upgrade/candidate.apk ANDROID_TEST_APK=build/signing-upgrade/native-test.apk sh tools/test-android-i18n.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-read-receipts-api-${{ matrix.api }}
          path: |
            build/android-i18n-device.txt
            build/android-i18n-logcat.txt
            build/android-i18n-screenshots/
            build/android-attachment-screenshots/
          if-no-files-found: warn
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[apple-ui]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native desktop receipts and foreground visibility
        shell: pwsh
        run: desktop/tools/test-receipts.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-read-receipts
          path: desktop/build/receipt-windows-*.png
          if-no-files-found: warn
  apple-read-ui:
    if: contains(github.event.head_commit.message, '[apple-ui]')
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ipad]
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile the production Java UI peer
        run: bash tools/test-apple-interop.sh --compile-java
      - name: Select native UI destination
        id: destination
        run: |
          python3 - '${{ matrix.platform }}' <<'PY'
          import json,os,subprocess,sys
          if sys.argv[1]=='macos': destination='platform=macOS'
          else:
              devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
              runtime,template=next((r,d) for r,ds in devices.items() if '.iOS-' in r for d in ds if d['name'].startswith('iPad'))
              device=subprocess.check_output(['xcrun','simctl','create','Read receipts iPad',template['deviceTypeIdentifier'],runtime],text=True).strip()
              destination='platform=iOS Simulator,id='+device
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('value='+destination+'\n')
          PY
      - name: Native focused and hidden conversation read receipts
        env:
          WOZAI_APPLE_READ_UI: 'true'
          WOZAI_APPLE_UI_TEST: NearbyIMUITests/NativeChatTests/testReadReceiptForegroundVisibilityWithJavaPeer
        run: bash tools/test-apple-ui.sh '${{ steps.destination.outputs.value }}' read-${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-read-ui-${{ matrix.platform }}
          path: build/apple-ui/
          if-no-files-found: warn
