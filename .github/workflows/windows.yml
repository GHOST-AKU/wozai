name: Build 我在 Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      - name: Test desktop and create portable Windows package
        shell: pwsh
        run: ./desktop/tools/build.ps1 -Package
      - name: Test shared Android protocol and trust
        shell: pwsh
        run: |
          ./tools/test-core.ps1
          ./tools/test-trust.ps1
      - name: Run packaged Windows executable
        shell: pwsh
        run: ./desktop/tools/test-package.ps1
      - name: Exercise bundled runtime GUI
        if: always()
        shell: pwsh
        run: |
          & 'desktop/build/package/WoZai/runtime/bin/java.exe' -cp 'desktop/build/package/WoZai/app/*;desktop/build/tests' dev.ghost.wozai.GuiTests desktop/build/gui-bundled-runtime.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native GUI and mDNS
        shell: pwsh
        run: |
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.DiscoveryTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.GuiTests desktop/build/gui-windows.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: wozai-windows-x64
          path: desktop/build/package
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview-verification
          path: |
            desktop/build/gui-windows.png
            desktop/build/package-window.png
            desktop/build/gui-bundled-runtime.png
          if-no-files-found: ignore
