name: Build NearbyIM Windows client
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - 'apple/**'
      - '.github/workflows/apple.yml'
      - 'tools/test-apple-*.sh'
      - 'tests/apple/**'
      - 'docs/apple.md'
      - 'README.md'
      - 'docs/readme/README.en.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      android-run-id:
        description: 'Successful signed Android workflow run from this exact source; finalize all preview assets'
        type: string
        default: ''
      release-tag:
        description: 'Upload verified packages to an existing draft release (requires include-linux)'
        type: string
        default: ''
      include-linux:
        description: 'Also run Linux package and platform compatibility verification'
        type: boolean
        default: false
      performance-baseline:
        description: 'Measure an informational baseline (no performance thresholds)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux-compatibility:
    if: inputs['include-linux'] || github.ref_name == 'feat/linux-client'
    uses: ./.github/workflows/linux.yml
    with:
      performance-baseline: ${{ inputs['performance-baseline'] }}
      release-tag: ${{ inputs['release-tag'] }}
  windows:
    # Native Apple drafts do not need another Windows package; review-ready PRs still run all checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'feat/apple-native' || !github.event.pull_request.draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      - name: Read shared release version
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content i18n/config.json -Raw -Encoding UTF8 | ConvertFrom-Json).appVersion
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test desktop and create portable Windows package
        shell: pwsh
        env:
          WOZAI_RELEASE_TAG: ${{ inputs['release-tag'] }}
        run: |
          $previewRelease = $env:WOZAI_RELEASE_TAG -match '^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[1-9][0-9]*$'
          ./desktop/tools/build.ps1 -Package -PreviewRelease:$previewRelease
      - name: Test shared Android protocol and trust
        shell: pwsh
        run: |
          ./tools/test-i18n.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/test-core.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/test-trust.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify text compatibility with pinned old NIM4 clients
        shell: bash
        run: sh tools/test-text-legacy.sh
      - name: Run packaged Windows executable
        shell: pwsh
        run: ./desktop/tools/test-package.ps1
      - name: Exercise bundled runtime GUI
        if: always()
        shell: pwsh
        run: |
          & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.GuiTests desktop/build/gui-bundled-runtime.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.TransferPathGuiTests
          if($LASTEXITCODE -ne 0) { throw 'Bundled transfer path GUI tests failed' }
          & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.TransferPathWindowTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.AvatarGuiTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.DesktopRetryTests --gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.ThumbnailScrollTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.VerificationGuiTests desktop/build/gui-verification-windows-bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native GUI and mDNS
        shell: pwsh
        run: |
          & "$env:JAVA_HOME/bin/java.exe" "-Dwozai.bluetooth.library=$((Resolve-Path desktop/build/lib/wozai_bluetooth.dll).Path)" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.DiscoveryTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" "-Dwozai.bluetooth.library=$((Resolve-Path desktop/build/lib/wozai_bluetooth.dll).Path)" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.GuiTests desktop/build/gui-windows.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.DesktopRetryTests --gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.ThumbnailScrollTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.AttachmentSelectionGuiTests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.TransferPathGuiTests
          if($LASTEXITCODE -ne 0) { throw 'Transfer path GUI tests failed' }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.TransferPathWindowTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.AvatarGuiTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.VerificationGuiTests desktop/build/gui-verification-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:JAVA_HOME/bin/java.exe" "-Dwozai.bluetooth.library=$((Resolve-Path desktop/build/lib/wozai_bluetooth.dll).Path)" -cp 'desktop/build/classes;desktop/build/tests;desktop/build/lib/*' dev.ghost.wozai.LayoutTests desktop/build/gui-settings-windows.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise bundled runtime layout at 100, 125, 150 and 200 percent scaling
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5', '2')) {
            & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' "-Dsun.java2d.uiScale=$scale" -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.LayoutTests "desktop/build/gui-settings-dpi-$scale.png"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify native Windows text pixels at 100, 125, 150 and 200 percent scaling
        shell: pwsh
        run: |
          foreach ($scale in @('1', '1.25', '1.5', '2')) {
            & 'desktop/build/package/NearbyIM/runtime/bin/java.exe' "-Dsun.java2d.uiScale=$scale" -cp 'desktop/build/package/NearbyIM/app/*;desktop/build/tests' dev.ghost.wozai.TextRenderingTests "desktop/build/text-rendering-$scale"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Measure desktop performance baseline
        if: inputs['performance-baseline']
        shell: pwsh
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tools/performance.py measure --image desktop/build/package/NearbyIM --test-classes desktop/build/tests --environment-kind ci --device 'GitHub windows-latest x64 runner; desktop session' --output desktop/build/performance-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always() && inputs['performance-baseline']
        with:
          name: windows-performance-baseline
          path: |
            desktop/build/performance-windows.json
            desktop/build/performance-windows.logs
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NearbyIM-${{ steps.metadata.outputs.version }}-windows-x64
          path: desktop/build/package
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview-verification
          path: |
            desktop/build/gui-windows*.png
            desktop/build/gui-attachments-windows*.png
            desktop/build/gui-settings*.png
            desktop/build/package-window.png
            desktop/build/gui-bundled-runtime*.png
            desktop/build/*-text-rendering.txt
            desktop/build/text-rendering-*.png
            desktop/build/text-rendering-*.txt
          if-no-files-found: ignore
  stage-release:
    if: inputs['release-tag'] != '' && inputs['include-linux']
    needs: [windows, linux-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: metadata
        run: python3 -c 'import json; print("version=" + json.load(open("i18n/config.json"))["appVersion"])' >> "$GITHUB_OUTPUT"
      - name: Install AppImage payload inspection tool
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - uses: actions/setup-java@v4
        if: inputs['android-run-id'] != ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: inputs['android-run-id'] != ''
        with:
          packages: platform-tools
      - name: Install Android asset verification tools
        if: inputs['android-run-id'] != ''
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: NearbyIM-${{ steps.metadata.outputs.version }}-windows-x64
          path: build/release-input/windows
      - uses: actions/download-artifact@v4
        with:
          name: NearbyIM-${{ steps.metadata.outputs.version }}-linux-x64
          path: build/release-input/linux
      - name: Validate and stage desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs['release-tag'] }}
        run: python3 tools/release-assets.py desktop
      - uses: actions/download-artifact@v4
        if: inputs['android-run-id'] != ''
        with:
          name: android-signed-release
          path: build/release-input/android-signed
          run-id: ${{ inputs['android-run-id'] }}
          github-token: ${{ github.token }}
      - name: Verify signed Android and finalize preview assets in the draft
        if: inputs['android-run-id'] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs['release-tag'] }}
          SIGNED_ANDROID_RUN_ID: ${{ inputs['android-run-id'] }}
        run: python3 tools/release-assets.py preview
