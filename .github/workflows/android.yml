name: Build 我在 Android previews
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed-upgrade-input-run:
        description: 'Run ID containing locally signed public APKs for upgrade acceptance (no private key required)'
        type: string
        default: ''
      release-tag:
        description: 'Validate the signed APKs already uploaded to an existing draft release'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  signed-candidate:
    # Only this owner-controlled implementation branch can consume signing secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/v0.3.2-large-file-transfer'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-release.yml
    secrets: inherit
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read shared release version
        id: metadata
        run: python3 -c 'import json; print("version=" + json.load(open("i18n/config.json"))["appVersion"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Source and protocol checks
        run: |
          sh tools/test-i18n.sh
          sh tools/test-core.sh
          sh tools/test-noise-candidate.sh
          sh tools/test-trust.sh
          sh tools/check-source.sh
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
          ./gradlew --no-daemon -PtestBuildType=preview :app:assembleRelease :app:assemblePreview :app:assemblePreviewAndroidTest :app:lintPreview
      - name: Verify APK signatures and alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > app/build/outputs/apk/checksums.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/preview/app-preview.apk > app/build/outputs/apk/preview-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 app/build/outputs/apk/preview/app-preview.apk
          sha256sum app/build/outputs/apk/preview/app-preview.apk app/build/outputs/apk/androidTest/preview/app-preview-androidTest.apk > app/build/outputs/apk/preview-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NearbyIM-${{ steps.metadata.outputs.version }}-android-preview
          path: |
            app/build/outputs/apk/preview/app-preview.apk
            app/build/outputs/apk/androidTest/preview/app-preview-androidTest.apk
            app/build/outputs/apk/preview-checksums.txt
            app/build/outputs/apk/preview-signature.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-r8-mapping
          path: app/build/outputs/mapping/preview/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NearbyIM-${{ steps.metadata.outputs.version }}-android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/checksums.txt
            app/build/outputs/apk/signature.txt
          if-no-files-found: error
  release-input:
    if: inputs['release-tag'] != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Validate the exact signed release APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs['release-tag'] }}
        run: python3 tools/release-assets.py android
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-validation-input
          path: |
            app/build/outputs/apk/preview/app-preview.apk
            app/build/outputs/apk/androidTest/preview/app-preview-androidTest.apk
          if-no-files-found: error
  android-localization:
    needs: [build, release-input]
    if: always() && needs.build.result == 'success' && (needs.release-input.result == 'success' || needs.release-input.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs['release-tag'] != '' && 'android-release-validation-input' || format('NearbyIM-{0}-android-preview', needs.build.outputs.version) }}
          path: app/build/outputs/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native ICU and live locale recreation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ANDROID_APP_APK=app/build/outputs/apk/preview/app-preview.apk ANDROID_TEST_APK=app/build/outputs/apk/androidTest/preview/app-preview-androidTest.apk sh tools/test-android-i18n.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-localization-api-${{ matrix.api-level }}
          path: |
            build/android-i18n-device.txt
            build/android-i18n-logcat.txt
            build/android-i18n-screenshots/
          if-no-files-found: ignore
  signing-upgrade:
    if: inputs['signed-upgrade-input-run'] != ''
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android-upgrade.yml
    with:
      input-run-id: ${{ inputs['signed-upgrade-input-run'] }}
