name: Verify embedded Apple public Mesh
on:
  workflow_dispatch:
    inputs:
      validation:
        type: choice
        options: [tests, core-and-apps]
        default: core-and-apps
permissions:
  contents: read
jobs:
  mesh:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mesh
            mesh/apple-bridge -> ../target
      - name: Build embedded native Core XCFramework
        if: inputs.validation == 'core-and-apps'
        run: bash tools/build-apple-mesh.sh
      - name: Swift native Core, protocol and stream tests
        run: swift test --package-path apple
      - name: Rust Core and C ABI checks
        if: inputs.validation == 'core-and-apps'
        run: |
          cargo test --manifest-path mesh/Cargo.toml --locked
          CARGO_TARGET_DIR=mesh/target cargo test --manifest-path mesh/apple-bridge/Cargo.toml --locked
      - name: Build native macOS app
        if: inputs.validation == 'core-and-apps'
        run: xcodebuild -project apple/NearbyIM.xcodeproj -scheme NearbyIM -destination 'platform=macOS' -configuration Release -derivedDataPath apple/DerivedData ONLY_ACTIVE_ARCH=NO 'ARCHS=arm64 x86_64' CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS device app
        if: inputs.validation == 'core-and-apps'
        run: xcodebuild -project apple/NearbyIM.xcodeproj -scheme NearbyIM -destination 'generic/platform=iOS' -configuration Release -derivedDataPath apple/DeviceBuild CODE_SIGNING_ALLOWED=NO build
