name: Verify no-install LAN speed probe
on:
  push:
    branches: [diag/lan-browser-speed]
    paths: [tools/lan-speed.ps1, tools/test-lan-speed.py, .github/workflows/lan-speed-probe.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test harness
        run: python -m pip install playwright==1.62.0
      - name: Test Windows built-in PowerShell 5.1 and Edge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python tools/test-lan-speed.py --powershell powershell.exe --browser-channel msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test PowerShell 7 and Edge
        shell: pwsh
        run: |
          python tools/test-lan-speed.py --powershell pwsh.exe --browser-channel msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: lan-speed-browser-verification
          path: build/lan-speed-browser.png
          if-no-files-found: error
