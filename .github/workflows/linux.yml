name: Build NearbyIM Linux client
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - 'mesh/**'
      - 'docs/mesh/**'
      - '.github/workflows/mesh.yml'
      - 'apple/**'
      - '.github/workflows/apple.yml'
      - 'tools/test-apple-*.sh'
      - 'tests/apple/**'
      - 'docs/apple.md'
      - 'README.md'
      - 'docs/readme/README.en.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      measure-ui-size:
        description: 'Measure pre-change UI package size once for the localization/emoji increment'
        type: boolean
        default: false
      packaging-only:
        description: 'Run package/GUI checks only; requires separately recorded unchanged-core validation'
        type: boolean
        default: false
      candidate-run-id:
        description: 'Runtime-only: reuse the AppImage artifact from this successful build job'
        type: string
        default: ''
      candidate-source:
        description: 'Runtime-only: exact 40-character source SHA embedded in that candidate'
        type: string
        default: ''
      performance-baseline:
        description: 'Measure an informational baseline (no performance thresholds)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      packaging-only:
        type: boolean
        default: false
      measure-ui-size:
        type: boolean
        default: false
      release-tag:
        type: string
        default: ''
      performance-baseline:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  linux:
    # Native Apple drafts do not need another Linux package; review-ready PRs still run all checks.
    if: inputs['candidate-run-id'] == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'feat/apple-native' || !github.event.pull_request.draft)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      # Ubuntu 22.04's Python 3.10 backport resolves relative symlink targets
      # from the archive root. Keep the data filter on a maintained verifier.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build and GUI verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev dbus-x11 xvfb xauth x11-utils desktop-file-utils libasound2 squashfs-tools locales
          # The Unicode-path fixture needs a valid display locale as well as LC_CTYPE.
          sudo localedef -i zh_CN -f UTF-8 zh_CN.UTF-8
          python3 -m pip install Pillow
      - name: Read shared release version
        id: metadata
        run: python3 -c 'import json; print("version=" + json.load(open("i18n/config.json"))["appVersion"])' >> "$GITHUB_OUTPUT"
      - name: Verify protocol, trust and generated translations
        if: inputs['packaging-only'] != true
        run: |
          python3 tests/test_appimage_runtime.py
          sh tools/test-i18n.sh
          sh tools/test-core.sh
          sh tools/test-trust.sh
          sh tools/check-source.sh
      - name: Test BlueZ JNI and build Linux packages
        env:
          WOZAI_RELEASE_TAG: ${{ inputs['release-tag'] }}
        run: sh desktop/tools/build.sh --package
      - name: Measure controlled desktop package size delta
        if: inputs['measure-ui-size']
        run: python3 tools/measure-ui-size.py desktop
      # Retain the candidate even if a later verification step fails.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-runtime-input
          path: |
            desktop/build/NearbyIM-*-linux-x64.AppImage
            desktop/build/tests/dev/ghost/wozai/DiscoveryTests*.class
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NearbyIM-${{ steps.metadata.outputs.version }}-linux-x64
          path: |
            desktop/build/NearbyIM-*-linux-x64.tar.gz
            desktop/build/NearbyIM-*-linux-x64.deb
            desktop/build/NearbyIM-*-linux-x64.AppImage
            desktop/build/linux-checksums.txt
            desktop/build/ui-size.json
          if-no-files-found: error
      - name: Verify native GUI, bundled runtime, scaling, mDNS and actual packaged launcher
        run: xvfb-run -a -s '-screen 0 2560x1800x24' sh desktop/tools/test-linux-gui.sh
      - name: Measure desktop performance baseline
        if: inputs['performance-baseline']
        run: |
          python3 -m pip install psutil==7.2.2
          xvfb-run -a -s '-screen 0 2560x1800x24' python3 desktop/tools/performance.py measure --image desktop/build/package/NearbyIM --test-classes desktop/build/tests --environment-kind ci --device 'GitHub ubuntu-22.04 x64 runner; Xvfb 2560x1800' --output desktop/build/performance-linux.json
      - uses: actions/upload-artifact@v4
        if: always() && inputs['performance-baseline']
        with:
          name: linux-performance-baseline
          path: |
            desktop/build/performance-linux.json
            desktop/build/performance-linux.logs
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-preview-verification
          path: |
            desktop/build/gui-linux*.png
            desktop/build/gui-attachments-linux*.png
            desktop/build/linux-package*.png
            desktop/build/linux-package*.txt
            desktop/build/linux-appimage*.png
            desktop/build/linux-appimage*.txt
          if-no-files-found: ignore
  appimage-runtime:
    needs: linux
    if: ${{ !cancelled() && (needs.linux.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs['candidate-run-id'] != '')) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: '22.04'
            audio: libasound2
          - distribution: '24.04'
            audio: libasound2t64
    # These fresh userspaces have runtime libraries, no compiler or host JDK.
    # Both verify identical downloaded bytes from the single baseline build.
    container: ubuntu:${{ matrix.distribution }}
    steps:
      - name: Install runtime-only GUI verification dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 python3-pil libstdc++6 libglib2.0-bin libx11-6 libxext6 libxi6 libxrender1 libxtst6 libfreetype6 libfontconfig1 ${{ matrix.audio }} dbus-x11 xvfb xauth x11-utils desktop-file-utils locales
          localedef -i zh_CN -f UTF-8 zh_CN.UTF-8
          ! command -v javac
          ! command -v g++
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs['candidate-source'] || github.sha }}
      - name: Validate candidate source and trust this checkout
        env:
          CANDIDATE_RUN: ${{ inputs['candidate-run-id'] }}
          CANDIDATE_SOURCE: ${{ inputs['candidate-source'] }}
        run: |
          python3 - <<'PY'
          import os, re
          if os.environ['CANDIDATE_RUN']:
              assert re.fullmatch(r'[0-9]+', os.environ['CANDIDATE_RUN']), 'A numeric candidate run is required'
              assert re.fullmatch(r'[0-9a-f]{40}', os.environ['CANDIDATE_SOURCE']), 'An exact candidate source SHA is required'
          PY
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-runtime-input
          path: desktop/build
          run-id: ${{ inputs['candidate-run-id'] || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify unchanged AppImage in clean runtime userspace
        run: |
          cat /etc/os-release
          sha256sum desktop/build/*.AppImage
          xvfb-run -a -s '-screen 0 2560x1800x24' python3 desktop/tools/test-linux-appimage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-ubuntu-${{ matrix.distribution }}-evidence
          path: |
            desktop/build/linux-appimage*.png
            desktop/build/linux-appimage*.txt
          if-no-files-found: error
