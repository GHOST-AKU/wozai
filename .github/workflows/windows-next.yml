name: Build and capture WinUI 3 我在next
on:
  push:
    branches: [feat/windows-next]
    paths:
      - 'windows-next/**'
      - '.github/workflows/windows-next.yml'
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Reuse an identical native package from this run for capture-only diagnostics'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-client:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile, test and package native client
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_run_id == ''
        shell: pwsh
        run: ./windows-next/tools/build.ps1 -Test
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != ''
        with:
          name: windows-next-native
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          path: windows-next/build/reused
      - name: Restore and verify identical native package
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != ''
        shell: pwsh
        run: |
          $zip = Get-ChildItem windows-next/build/reused -Recurse -Filter 'WoZai-next-*-windows-x64.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw 'Reusable native package missing' }
          Expand-Archive $zip.FullName -DestinationPath windows-next/build/package
          $package = 'windows-next/build/package/WoZaiNext'
          $source = (Get-Content "$package/build-info.json" -Raw | ConvertFrom-Json).source
          git diff --exit-code $source HEAD -- app desktop third_party i18n windows-next/WindowsNext windows-next/bridge/src/main windows-next/tools/build.ps1 windows-next/tools/build-bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Native package sources changed; run a full build instead' }
          New-Item -ItemType Directory -Force windows-next/build/bridge/classes,windows-next/build/bridge/tests,windows-next/build/bridge/lib | Out-Null
          Copy-Item "$package/kernel/lib/*.jar" windows-next/build/bridge/lib/
          & "$env:JAVA_HOME/bin/javac.exe" --release 17 -encoding UTF-8 -cp "$package/kernel/lib/*" -d windows-next/build/bridge/tests windows-next/bridge/src/test/java/dev/ghost/wozai/next/BridgeFixtures.java
          if ($LASTEXITCODE -ne 0) { throw 'Capture fixture compilation failed' }
          Copy-Item $zip.FullName windows-next/build/
          Write-Output "Reused native binary source: $source"
      - name: Launch actual WinUI window and capture screenshots
        shell: pwsh
        run: ./windows-next/tools/capture.ps1
      - name: Record screenshot pixels for API retrieval
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem windows-next/build/screenshots/*.png -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "NEXT_SCREENSHOT_BEGIN:$($_.Name)"
            $encoded=[Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for($offset=0;$offset -lt $encoded.Length;$offset+=4096) { Write-Output ('NEXT_SCREENSHOT_DATA:'+$encoded.Substring($offset,[Math]::Min(4096,$encoded.Length-$offset))) }
            Write-Output 'NEXT_SCREENSHOT_END'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-next-native
          compression-level: 0
          path: |
            windows-next/build/WoZai-next-*-windows-x64.zip
            windows-next/build/screenshots/
            windows-next/Tests/TestResults/
          if-no-files-found: warn
