# Reuse exact f221fed packages; configure the UTF-8 display locale used by Unicode-path fixtures.
name: Unchanged native artifacts and legacy contract
'on':
  push:
    branches:
    - verify/ui-contract-followup
permissions:
  contents: read
  actions: read
jobs:
  appimage-runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - distribution: '22.04'
          audio: libasound2
        - distribution: '24.04'
          audio: libasound2t64
    container: ubuntu:${{ matrix.distribution }}
    steps:
    - name: Install runtime-only GUI verification dependencies
      run: 'apt-get update

        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 python3-pil
        libstdc++6 libglib2.0-bin libx11-6 libxext6 libxi6 libxrender1 libxtst6 libfreetype6 libfontconfig1 ${{ matrix.audio
        }} dbus-x11 xvfb xauth x11-utils desktop-file-utils locales

        localedef -i zh_CN -f UTF-8 zh_CN.UTF-8

        ! command -v javac

        ! command -v g++

        '
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify unchanged candidate source and overlay updated launcher checks
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        git diff --exit-code f221fedfedf3878c79d3b8ac56dc5c57feebae4f HEAD -- app/src/main desktop/src/main desktop/native
        i18n tools tests third_party '':(exclude)**/*.md''

        git checkout --detach f221fedfedf3878c79d3b8ac56dc5c57feebae4f

        git restore --source="$GITHUB_SHA" -- desktop/tools/test-linux-package.py desktop/tools/test-linux-appimage.py

        locale -a

        '
    - uses: actions/download-artifact@v4
      with:
        name: linux-appimage-runtime-input
        path: desktop/build
        run-id: '40653563567'
        github-token: ${{ github.token }}
    - name: Verify unchanged AppImage in clean runtime userspace
      run: 'cat /etc/os-release

        sha256sum desktop/build/*.AppImage

        xvfb-run -a -s ''-screen 0 2560x1800x24'' python3 desktop/tools/test-linux-appimage.py

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linux-appimage-ubuntu-${{ matrix.distribution }}-evidence
        path: 'desktop/build/linux-appimage*.png

          desktop/build/linux-appimage*.txt


          desktop/build/linux-package*.txt

          desktop/build/linux-package*.png'
        if-no-files-found: error
  portable-launcher:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify unchanged candidate source and overlay updated launcher checks
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        git diff --exit-code f221fedfedf3878c79d3b8ac56dc5c57feebae4f HEAD -- app/src/main desktop/src/main desktop/native
        i18n tools tests third_party '':(exclude)**/*.md''

        git checkout --detach f221fedfedf3878c79d3b8ac56dc5c57feebae4f

        git restore --source="$GITHUB_SHA" -- desktop/tools/test-linux-package.py desktop/tools/test-linux-appimage.py

        locale -a

        '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install launcher-verifier dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y xvfb xauth x11-utils desktop-file-utils libglib2.0-bin locales

        sudo localedef -i zh_CN -f UTF-8 zh_CN.UTF-8

        python3 -m pip install Pillow

        '
    - uses: actions/download-artifact@v4
      with:
        name: NearbyIM-0.3.3-preview.2-linux-x64
        path: desktop/build
        run-id: '40653563567'
        github-token: ${{ github.token }}
    - name: Verify exact candidate portable launcher
      run: xvfb-run -a -s '-screen 0 2560x1800x24' python3 desktop/tools/test-linux-package.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: linux-portable-followup-evidence
        path: 'desktop/build/linux-package*.txt

          desktop/build/linux-package*.png'
        if-no-files-found: error
