name: Verify native Apple clients
on:
  push:
    branches: [feat/apple-native]
    paths: ['i18n/config.json', 'tools/version.py', 'apple/**', '.github/workflows/apple.yml', 'tools/test-apple-*.sh', 'tests/apple/**']
  pull_request:
    branches: [main]
    paths: ['i18n/config.json', 'tools/version.py', 'apple/**', '.github/workflows/apple.yml', 'tools/test-apple-*.sh', 'tests/apple/**']
  workflow_dispatch:
    inputs:
      validation:
        description: Full, macOS UI only, core/device builds only, or core plus iOS UI
        type: choice
        options: [full, macos-ui, core-builds, core-ios, mobile-ui]
        default: full
permissions:
  contents: read
concurrency:
  group: apple-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.validation || 'full' }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check shared preview version
        run: |
          python3 tools/version.py --check
          python3 tests/test_version.py
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test shared native core
        if: ${{ inputs.validation != 'macos-ui' && inputs.validation != 'mobile-ui' }}
        run: bash tools/test-apple-lifecycle.sh
      - name: Exchange encrypted records with the production Java implementation
        if: ${{ inputs.validation != 'macos-ui' && inputs.validation != 'mobile-ui' }}
        run: bash tools/test-apple-interop.sh
      - name: Build universal native macOS Release and record footprint
        if: ${{ inputs.validation != 'macos-ui' && inputs.validation != 'mobile-ui' }}
        run: |
          mkdir -p build/apple-ui
          xcodebuild -project apple/NearbyIM.xcodeproj -scheme NearbyIM -destination 'platform=macOS' -configuration Release -derivedDataPath apple/DerivedData ONLY_ACTIVE_ARCH=NO 'ARCHS=arm64 x86_64' CODE_SIGNING_ALLOWED=NO build
          app=apple/DerivedData/Build/Products/Release/NearbyIM.app
          lipo -info "$app/Contents/MacOS/NearbyIM" | tee build/apple-ui/macos-release-footprint.log
          du -sk "$app" | tee -a build/apple-ui/macos-release-footprint.log
          otool -L "$app/Contents/MacOS/NearbyIM" | tee -a build/apple-ui/macos-release-footprint.log
      - name: Build native iPhone and iPad app for devices without distribution signing
        if: ${{ inputs.validation != 'macos-ui' }}
        run: xcodebuild -project apple/NearbyIM.xcodeproj -scheme NearbyIM -destination 'generic/platform=iOS' -configuration Release -derivedDataPath apple/DeviceBuild CODE_SIGNING_ALLOWED=NO build
      - name: Compile the independent Java peer for a focused UI run
        if: ${{ inputs.validation == 'macos-ui' || inputs.validation == 'mobile-ui' }}
        run: bash tools/test-apple-interop.sh --compile-java
      - name: Exercise native macOS consent, chat and receipts
        if: ${{ inputs.validation != 'core-builds' && inputs.validation != 'core-ios' && inputs.validation != 'mobile-ui' }}
        timeout-minutes: 8
        run: bash tools/test-apple-ui.sh 'platform=macOS' macos
      - name: Select available iPhone and iPad simulators
        if: ${{ inputs.validation != 'macos-ui' && inputs.validation != 'core-builds' }}
        id: simulators
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          ios = [(runtime, d) for runtime, values in devices.items() if '.iOS-' in runtime for d in values]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, prefix in [('iphone', 'iPhone'), ('ipad', 'iPad')]:
                  runtime, template = next((r, d) for r, d in ios if d['name'].startswith(prefix))
                  device = subprocess.check_output(['xcrun', 'simctl', 'create', 'Wozai CI ' + prefix, template['deviceTypeIdentifier'], runtime], text=True).strip()
                  output.write(f"{key}={device}\n")
          PY
      # Keep simulator migration/SDK compilation outside the UI execution budget.
      - name: Prepare iPhone simulator and native UI test bundle
        id: iphone_prepare
        if: ${{ !cancelled() && steps.simulators.outcome == 'success' }}
        timeout-minutes: 12
        run: bash tools/test-apple-ui.sh 'platform=iOS Simulator,id=${{ steps.simulators.outputs.iphone }}' iphone --prepare-only
      - name: Exercise native iPhone consent, chat and receipts
        if: ${{ !cancelled() && steps.iphone_prepare.outcome == 'success' }}
        timeout-minutes: 12
        run: bash tools/test-apple-ui.sh 'platform=iOS Simulator,id=${{ steps.simulators.outputs.iphone }}' iphone --test-only
      - name: Prepare iPad simulator and native UI test bundle
        id: ipad_prepare
        if: ${{ !cancelled() && steps.simulators.outcome == 'success' }}
        timeout-minutes: 12
        run: bash tools/test-apple-ui.sh 'platform=iOS Simulator,id=${{ steps.simulators.outputs.ipad }}' ipad --prepare-only
      - name: Exercise native iPad consent, chat and receipts
        if: ${{ !cancelled() && steps.ipad_prepare.outcome == 'success' }}
        timeout-minutes: 12
        run: bash tools/test-apple-ui.sh 'platform=iOS Simulator,id=${{ steps.simulators.outputs.ipad }}' ipad --test-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-native-evidence
          path: |
            build/apple-lifecycle/
            build/apple-interop/*.log
            build/apple-ui/
