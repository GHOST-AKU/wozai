name: Verify independent Nearby Mesh lab
on:
  pull_request:
    branches: [main]
    paths: ['mesh/**', 'docs/mesh/**', '.github/workflows/mesh.yml', '.cargo/**', 'rust-toolchain', 'rust-toolchain.toml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mesh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mesh:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MESH_VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact requested revision
        run: test "$(git rev-parse HEAD)" = "$MESH_VERIFIED_SHA"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mesh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Formatting, static checks and core resource contracts
        run: |
          cargo fmt --manifest-path mesh/Cargo.toml --check
          cargo clippy --manifest-path mesh/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path mesh/Cargo.toml --locked
          cargo build --manifest-path mesh/Cargo.toml --locked --release
      - name: Verify locked dependency notices (no writes)
        run: |
          cargo fetch --manifest-path mesh/Cargo.toml --locked
          python3 mesh/tools/licenses.py --check
      - name: Record measured build and source snapshot
        run: python3 mesh/tools/evidence.py --build-profile release --output mesh/target/ci-source.json
      - name: Independent process and probe capture tests
        env:
          MESH_BINARY: ${{ github.workspace }}/mesh/target/release/mesh-lab
        run: |
          python3 -m unittest discover -s mesh/tests -p 'test_*.py' -v
          python3 -m unittest discover -s mesh/android-probe/tests -v
      - name: Isolated TCP topology; never a wireless acceptance claim
        env:
          MESH_BINARY: ${{ github.workspace }}/mesh/target/release/mesh-lab
        run: |
          python3 mesh/tools/lab.py --output mesh/target/ci-isolated.json
          python3 mesh/tools/lab.py --discovery --output mesh/target/ci-discovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesh-isolated-tcp-evidence
          path: mesh/target/ci-*.json
          if-no-files-found: error
