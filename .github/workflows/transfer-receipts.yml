name: Verify transfer summaries and native receipt UI
on:
  push:
    branches: [feat/transfer-diagnostics-receipts]
permissions:
  contents: read
  actions: read
jobs:
  android-build:
    if: github.repository == 'GHOST-AKU/wozai' && github.ref == 'refs/heads/feat/transfer-diagnostics-receipts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      # Build/Lint, JVM diagnostics and API34 passed for these exact client bytes.
      - uses: actions/download-artifact@v4
        with:
          name: android-fixed-signature-preview
          path: build/signing-upgrade
          run-id: '40715340688'
          github-token: ${{ github.token }}
      - name: Rebuild only the corrected native fixture for the verified fixed-signer client
        env:
          WOZAI_ANDROID_KEYSTORE_BASE64: ${{ secrets.WOZAI_ANDROID_KEYSTORE_BASE64 }}
          WOZAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WOZAI_ANDROID_KEYSTORE_PASSWORD }}
          WOZAI_ANDROID_CANDIDATE_ONLY: 'true'
        run: python3 tools/build-signed-android.py --preview --fixtures-for 5550b203c782040f9fb999ca5a23023721be9ed8
      - uses: actions/upload-artifact@v4
        with:
          name: android-fixed-signature-preview
          path: |
            build/signing-upgrade/candidate.apk
            build/signing-upgrade/signature.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-native-receipt-fixture
          path: build/signing-upgrade/native-test.apk
          if-no-files-found: error
  android-ui:
    needs: android-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            profile: pixel_2
            night: 'no'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-fixed-signature-preview
          path: build/receipt-native
      - uses: actions/download-artifact@v4
        with:
          name: INTERNAL-native-receipt-fixture
          path: build/receipt-native
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell cmd uimode night ${{ matrix.night }}
            ANDROID_APP_APK=build/receipt-native/candidate.apk ANDROID_TEST_APK=build/receipt-native/native-test.apk sh tools/test-android-i18n.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-receipts-api-${{ matrix.api }}
          path: |
            build/android-i18n-device.txt
            build/android-i18n-logcat.txt
            build/android-i18n-screenshots/
  windows:
    # Same desktop/UI sources passed in run 40714059795; do not repeat that job.
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and exercise the changed desktop surface without repackaging
        shell: pwsh
        run: desktop/tools/test-receipts.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-message-receipts
          path: desktop/build/receipt-windows-*.png
