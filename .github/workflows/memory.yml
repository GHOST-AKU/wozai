name: Measure candidate desktop memory trends
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/memory.yml'
      - 'desktop/tools/memory-trend.py'
      - 'desktop/src/main/java/**'
      - 'app/src/main/java/dev/ghost/nearbyim/core/**'
      - 'app/src/main/java/dev/ghost/nearbyim/noise/**'
permissions:
  contents: read
jobs:
  windows-memory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/v0.3.2-large-file-transfer'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and verify the actual Windows clients
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop/tools/build.ps1
      - name: Measure three idle and three authenticated connections for 30 minutes
        shell: pwsh
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tools/test-memory-clock.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tools/memory-trend.py --seconds 1800 --rounds 3 --output desktop/build/memory-30min/report.json --work-dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-memory-30min
          path: desktop/build/memory-30min
          if-no-files-found: error
