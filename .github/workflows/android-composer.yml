name: Verify Android composer with the persistent certificate
on:
  push:
    branches: [fix/android-composer-panel]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    # Only the owner-controlled implementation branch or a manual main run can sign.
    if: github.repository == 'GHOST-AKU/wozai' && (github.ref == 'refs/heads/fix/android-composer-panel' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Check resources and prove unchanged protocol sources
        run: |
          git diff --exit-code 46454b35607a7c869ce9694f827f5100fc6e00df HEAD -- app/src/main/java/dev/ghost/nearbyim/core app/src/main/java/dev/ghost/nearbyim/noise app/src/main/java/dev/ghost/nearbyim/storage app/src/main/java/dev/ghost/nearbyim/transport app/src/main/java/dev/ghost/nearbyim/ChatController.java app/src/main/java/dev/ghost/nearbyim/ChatStore.java third_party
          sh tools/test-i18n.sh
          sh tools/check-source.sh
      - name: Build, lint and pin the actual candidate with the existing private key
        env:
          WOZAI_ANDROID_KEYSTORE_BASE64: ${{ secrets.WOZAI_ANDROID_KEYSTORE_BASE64 }}
          WOZAI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WOZAI_ANDROID_KEYSTORE_PASSWORD }}
          WOZAI_ANDROID_CANDIDATE_ONLY: 'true'
        run: python3 tools/build-signed-android.py --preview
      - name: Confirm the delivery certificate independently
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path('build/signing-upgrade/signature.json').read_text())
          assert info['certificate_sha256']=='47a10fd5a882ab26c9a11fcc61df3b41f7c41017746fc6840cfbe581ca52c1dd'
          assert info['debuggable'] is False
          print(json.dumps(info))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('build/signing-upgrade/signature.json') != ''
        with:
          name: android-fixed-signature-preview
          path: |
            build/signing-upgrade/candidate.apk
            build/signing-upgrade/signature.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-android-composer-native-input
          path: |
            build/signing-upgrade/candidate.apk
            build/signing-upgrade/native-test.apk
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: NearbyIM-0.3.3-preview.2-android-preview
          path: build/withdrawn-signer
          run-id: '40652114332'
          github-token: ${{ github.token }}
      - name: Prepare exact published-code12 and withdrawn-wrong-signer upgrade inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/withdrawn-signer/preview/app-preview.apk build/signing-upgrade/wrong.apk
          python3 tools/prepare-android-upgrade.py prepare --baseline-code 12
      - uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-NOT-FOR-INSTALL-android-code12-upgrade-input
          path: |
            build/signing-upgrade/candidate.apk
            build/signing-upgrade/test.apk
            build/signing-upgrade/published-v032.apk
            build/signing-upgrade/wrong.apk
            build/signing-upgrade/input-manifest.json
          if-no-files-found: error
  native-ui:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            profile: pixel_2
          - api: 34
            profile: pixel_c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: INTERNAL-android-composer-native-input
          path: build/composer-native
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the fixed-signer APK on phone and tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ANDROID_APP_APK=build/composer-native/candidate.apk ANDROID_TEST_APK=build/composer-native/native-test.apk sh tools/test-android-i18n.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-composer-api-${{ matrix.api }}-evidence
          path: |
            build/android-i18n-device.txt
            build/android-i18n-logcat.txt
            build/android-i18n-screenshots/
          if-no-files-found: warn
  upgrade:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: INTERNAL-NOT-FOR-INSTALL-android-code12-upgrade-input
          path: build/signing-upgrade
      - name: Verify the public bytes, source and certificates before installing
        run: python3 tools/prepare-android-upgrade.py verify --baseline-code 12
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preserve published data and reject the exact withdrawn signer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: UPGRADE_BASELINE_CODE=12 sh tools/test-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-code12-upgrade-api-${{ matrix.api }}-evidence
          path: build/upgrade-evidence/
          if-no-files-found: warn
