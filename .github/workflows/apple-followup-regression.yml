name: Reproduce Apple attachment pause regression
on:
  push:
    branches: [test/apple-followup-regressions]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce in-flight PAUSE closing the text connection
        run: swift test --package-path apple --filter ReviewValidationTests.testPauseInFlightAfterRefusedOfferDoesNotEndChat
