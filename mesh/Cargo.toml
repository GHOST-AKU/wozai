[package]
name = "nearby-mesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Independent experimental Nearby Mesh core and headless lab"

[lib]
name = "nearby_mesh"

[[bin]]
name = "mesh-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hex = "0.4"
fs2 = "0.4"
mdns-sd = "0.15"
libc = "0.2"
if-addrs = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
