helpBody=局域网：双方连接同一个 Wi-Fi 或热点，开启接收后搜索，也可输入完整 IP 地址和端口。局域网文字以明文传输，请使用可信网络。\n\n蓝牙：对方开启接收并允许被发现后搜索，首次连接按系统提示配对。Windows 可通过“Windows 蓝牙设置”完成配对。已记住设备可通过历史直接连接，对方仍需开启蓝牙和接收服务。\n\n首次聊天可选择记住设备或仅本次。记住后验证同一设备身份再直接连接；可在设置中取消信任。\n\n待确认表示尚未收到保存回执，已送达表示对方已保存，未确认表示结果未知，不能表示已读。\n\n聊天记录保存在本机。Windows 端的草稿会保存，切换会话或重启后仍可恢复。退出后需要重新开启接收。\n\n便携版数据放在软件旁的 data 文件夹，旧版资料迁移后原件保留。设备私钥由当前 Windows 用户保护，复制到另一用户或电脑不会自动解锁身份。删除 data 会删除记录和设备信任。
aboutBody=我在 · NearbyIM\nWindows 预览版 0.2.2\n\n无需账号的附近文字聊天。\n\n通过局域网或蓝牙进行一对一文字聊天。消息保存在本机，删除本地数据会删除记录与设备信任。
