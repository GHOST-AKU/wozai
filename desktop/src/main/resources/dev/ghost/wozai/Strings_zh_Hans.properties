help=使用说明
helpBodyLinux=局域网：双方连接同一个 Wi-Fi 或热点，开启接收后搜索，也可输入完整 IP 地址和端口。局域网文字以明文传输，请使用可信网络。\n\n蓝牙：开启适配器和 BlueZ 系统服务。双方开启接收，被搜索的一方允许被发现。首次配对需要运行桌面系统的配对代理，可在系统蓝牙设置中配对。列表显示已配对及搜索到的设备，记住的设备可从历史重连。停止接收不会中断已建立的聊天。\n\n首次聊天可选择记住设备或仅本次。系统配对不等于应用内信任。重连验证同一公钥；可在设置中取消信任。\n\n待确认表示尚未收到保存回执，已送达表示对方已保存，未确认表示结果未知，均不表示已读。\n\n记录与草稿保存在本机，重启后保留。退出后需要重新开启接收。数据位于 XDG_DATA_HOME/wozai，默认 ~/.local/share/wozai，与软件安装位置无关。设备私钥没有额外加密，使用仅当前用户可访问的文件权限保护。删除数据会删除记录和设备信任。
helpBodyWindows=局域网：双方连接同一个 Wi-Fi 或热点，开启接收后搜索，也可输入完整 IP 地址和端口。局域网文字以明文传输，请使用可信网络。\n\n蓝牙：对方开启接收并允许被发现后搜索，首次连接按系统提示配对。Windows 可通过“Windows 蓝牙设置”完成配对。已记住设备可通过历史直接连接，对方仍需开启蓝牙和接收服务。\n\n首次聊天可选择记住设备或仅本次。记住后验证同一设备身份再直接连接；可在设置中取消信任。\n\n待确认表示尚未收到保存回执，已送达表示对方已保存，未确认表示结果未知，不能表示已读。\n\n聊天记录保存在本机。Windows 端的草稿会保存，切换会话或重启后仍可恢复。退出后需要重新开启接收。\n\n便携版数据放在软件旁的 data 文件夹，旧版资料迁移后原件保留。设备私钥由当前 Windows 用户保护，复制到另一用户或电脑不会自动解锁身份。删除 data 会删除记录和设备信任。
