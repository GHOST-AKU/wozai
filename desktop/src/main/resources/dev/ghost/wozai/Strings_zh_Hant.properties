androidLanHint=兩部裝置連線同一 Wi-Fi，或加入同一個熱點。
androidRequestBody={0}連線。記住後，下次可以直接連線。可在裝置資訊中取消信任。\n\n暱稱由對方填寫，裝置信任不認證真實姓名。
androidRequestLanBody={0}連線。記住後，下次可以直接連線。可在裝置資訊中取消信任。\n\n暱稱由對方填寫，裝置信任不認證真實姓名。聊天與檔案傳輸使用端對端加密。本機聊天記錄和附件不加密。
