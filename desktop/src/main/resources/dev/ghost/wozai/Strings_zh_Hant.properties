help=使用說明
helpBodyLinux=區域網路：雙方連線同一個 Wi-Fi 或熱點，開啟接收後搜尋，也可輸入完整 IP 位址和連接埠。聊天與檔案傳輸使用端對端加密。本機聊天記錄和附件不加密。\n\n藍牙：開啟介面卡與 BlueZ 系統服務。雙方開啟接收，被搜尋的一方允許被發現。首次配對需要執行桌面系統的配對代理，可在系統藍牙設定中配對。清單顯示已配對及搜尋到的裝置，記住的裝置可從歷史重新連線。停止接收不會中斷已建立的聊天。\n\n首次聊天可選擇記住裝置或僅本次。系統配對不等於應用程式內信任。重新連線會驗證同一公鑰；可在設定中取消信任。\n\n待確認表示尚未收到儲存回條，已送達表示對方已儲存，未確認表示結果未知，均不表示已讀。\n\n記錄與草稿儲存在本機，重新啟動後保留。退出後需要重新開啟接收。資料位於 XDG_DATA_HOME/wozai，預設 ~/.local/share/wozai，與軟體安裝位置無關。裝置私鑰沒有額外加密，使用僅目前使用者可存取的檔案權限保護。刪除資料會刪除記錄與裝置信任。
helpBodyWindows=區域網路：雙方連線同一個 Wi-Fi 或熱點，開啟接收後搜尋，也可輸入完整 IP 位址和連接埠。聊天與檔案傳輸使用端對端加密。本機聊天記錄和附件不加密。\n\n藍牙：對方開啟接收並允許被發現後搜尋，首次連線按系統提示配對。Windows 可透過「Windows 藍牙設定」完成配對。已記住裝置可透過歷史直接連線，對方仍需開啟藍牙和接收服務。\n\n首次聊天可選擇記住裝置或僅本次。記住後驗證同一裝置身分再直接連線；可在設定中取消信任。\n\n待確認表示尚未收到儲存回條，已送達表示對方已儲存，未確認表示結果未知，不能表示已讀。\n\n聊天記錄儲存在本機。Windows 端的草稿會儲存，切換會話或重新啟動後仍可恢復。退出後需要重新開啟接收。\n\n可攜式版本資料放在軟體旁的 data 資料夾，舊版資料遷移後原件保留。裝置私鑰由目前 Windows 使用者保護，複製到另一使用者或電腦不會自動解鎖身分。刪除 data 會刪除記錄和裝置信任。
