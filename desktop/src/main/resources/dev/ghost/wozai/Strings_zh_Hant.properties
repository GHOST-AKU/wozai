androidHelpBody=Wi-Fi 直連：Android 手機和平板可無需路由器連線。雙方選擇 Wi-Fi 直連、啟用接收並搜尋，並接受系統連線提示。連線至 Windows 或 Linux 時，雙方切換至區域網路並加入同一 Wi-Fi 或熱點。 取消或中斷後，請雙方都點選連線以重試。\n\n區域網路：雙方連線同一個 Wi-Fi 或熱點，開啟接收後搜尋，也可輸入完整 IP 位址和連接埠。聊天與檔案傳輸使用端對端加密。本機聊天記錄和附件不加密。\n\n藍牙：對方開啟接收並允許被發現後搜尋，首次連線按系統提示配對。已記住裝置可透過歷史直接連線，對方仍需開啟藍牙和接收服務。\n\n首次聊天可選擇記住裝置或僅本次。記住後驗證同一裝置身分再直接連線；可在設定中取消信任。\n\n待確認表示尚未收到儲存回條，已送達表示對方已儲存，未確認表示結果未知，不能表示已讀。\n\n聊天記錄儲存在本機。草稿在會話切換和介面重建時保留，停止應用程式後不保證保留。系統結束應用程式後需要重新開啟接收。
