androidHelpBody=Wi-Fi Direct：Android のスマートフォンやタブレットをルーターなしで接続できます。両方で Wi-Fi Direct を選び、受信を有効にして検索し、システムの接続確認を許可してください。Windows または Linux と接続する場合は両方を LAN に切り替え、同じ Wi-Fi またはホットスポットに接続してください。 キャンセルや切断の後は、両方の端末で接続を押して再試行してください。\n\nLAN：両方のデバイスを同じ Wi-Fi またはアクセスポイントに接続してください。受信を有効にして検索するか、IP アドレスとポートを入力します。チャットとファイル転送はエンドツーエンドで暗号化されます。このデバイスの履歴と添付ファイルは暗号化されません。\n\nBluetooth：相手が受信と検出を有効にしてから検索してください。初回の接続では、システムの指示に従ってペアリングします。登録済みのデバイスは、相手が Bluetooth と受信を有効にしていれば、履歴から再接続できます。\n\n初回のチャットでは、デバイスを登録するか、今回のみ許可できます。再接続時は同じデバイス識別情報か確認します。設定で信頼を解除できます。\n\n「確認待ち」は保存確認がまだ届いていない状態、「配信済み」は相手が保存した状態、「未確認」は結果が不明な状態です。いずれも既読を意味しません。\n\n履歴はこのデバイスに保存されます。チャットの切り替えや画面の再作成では下書きを保持しますが、アプリ停止後は失われる場合があります。システムがアプリを停止した場合は、受信を再び有効にしてください。
androidIdentityChanged=このデバイスの識別鍵が変わっています。再び信頼する場合は、設定で信頼を解除してから再接続してください。
androidLanHint=両方のデバイスを同じ Wi-Fi またはアクセスポイントに接続してください。
androidRequestBody={0} で接続します。デバイスを登録すると次回から再接続できます。デバイス情報で信頼を解除できます。\n\nニックネームは相手が入力したものです。デバイスの信頼は本名の確認を意味しません。
androidRequestLanBody={0} で接続します。デバイスを登録すると次回から再接続できます。デバイス情報で信頼を解除できます。\n\nニックネームは相手が入力したものです。デバイスの信頼は本名の確認を意味しません。チャットとファイル転送はエンドツーエンドで暗号化されます。このデバイスの履歴と添付ファイルは暗号化されません。
