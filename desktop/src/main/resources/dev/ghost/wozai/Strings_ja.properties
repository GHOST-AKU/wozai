androidWifiDirectHint=Android のスマートフォンやタブレットをルーターなしで接続できます。両方で Wi-Fi Direct を選び、受信を有効にして検索してください。Windows または Linux と接続する場合は両方で LAN を選び、同じ Wi-Fi またはホットスポットに接続してください。 キャンセルや切断の後は、両方の端末で接続を押して再試行してください。
