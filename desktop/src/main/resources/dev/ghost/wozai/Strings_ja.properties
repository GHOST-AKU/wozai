help=使い方
helpBodyLinux=LAN：両方のデバイスを同じ Wi-Fi またはアクセスポイントに接続してください。受信を有効にして検索するか、IP アドレスとポートを入力します。LAN のメッセージは平文で送信されるため、信頼できるネットワークを使用してください。\n\nBluetooth：アダプターと BlueZ システムサービスを有効にしてください。両方で受信を有効にし、検索される側を検出可能にします。初回のペアリングにはデスクトップのペアリングエージェントが必要です。システム設定でペアリングできます。登録済みのデバイスと検索結果を一覧に表示します。登録したデバイスは履歴から再接続できます。受信の停止は接続済みのチャットを切断しません。\n\n初回のチャットでは、デバイスを登録するか、今回のみ許可できます。システムのペアリングだけではアプリの信頼は付与されません。再接続時は同じ公開鍵を確認します。設定で信頼を解除できます。\n\n「確認待ち」は保存確認がまだ届いていない状態、「配信済み」は相手が保存した状態、「未確認」は結果が不明な状態です。いずれも既読を意味しません。\n\n履歴と下書きは再起動後も保持されます。終了後は受信を再び有効にしてください。データは XDG_DATA_HOME/wozai、既定では ~/.local/share/wozai に保存され、アプリの場所に依存しません。秘密鍵は追加の暗号化をせず、所有者だけがアクセスできるファイル権限で保護します。データを削除すると履歴と信頼も削除されます。
helpBodyWindows=LAN：両方のデバイスを同じ Wi-Fi またはアクセスポイントに接続してください。受信を有効にして検索するか、IP アドレスとポートを入力します。LAN のメッセージは平文で送信されるため、信頼できるネットワークを使用してください。\n\nBluetooth：相手が受信と検出を有効にしてから検索してください。初回の接続では、システムの指示に従ってペアリングします。必要に応じて Windows の Bluetooth 設定を開いてください。登録済みのデバイスは、相手が Bluetooth と受信を有効にしていれば、履歴から再接続できます。\n\n初回のチャットでは、デバイスを登録するか、今回のみ許可できます。再接続時は同じデバイス識別情報か確認します。設定で信頼を解除できます。\n\n「確認待ち」は保存確認がまだ届いていない状態、「配信済み」は相手が保存した状態、「未確認」は結果が不明な状態です。いずれも既読を意味しません。\n\n履歴はこのパソコンに保存されます。Windows の下書きはチャットを切り替えたり再起動したりしても復元できます。終了後は受信を再び有効にしてください。\n\nポータブル版のデータはアプリと同じ場所の data フォルダーにあります。移行後も元のファイルを保持します。秘密鍵は現在の Windows ユーザーで保護され、別のユーザーやパソコンでは自動的に解除できません。data を削除すると、履歴とデバイスの信頼も削除されます。
