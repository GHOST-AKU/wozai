about=NearbyIM について
aboutBodyLinux=我在 · NearbyIM\nLinux プレビュー版 {0}\n\nアカウント不要の、近くの人とのテキストチャット。\n\nLAN またはクラシック Bluetooth で 1 対 1 のチャットができます。メッセージはこのパソコンに保存されます。データを削除すると、履歴とデバイスの信頼も削除されます。
aboutBodyWindows=我在 · NearbyIM\nWindows プレビュー版 {0}\n\nアカウント不要の、近くの人とのテキストチャット。\n\nLAN または Bluetooth で 1 対 1 のチャットができます。メッセージはこのパソコンに保存されます。ローカルデータを削除すると、履歴とデバイスの信頼も削除されます。
