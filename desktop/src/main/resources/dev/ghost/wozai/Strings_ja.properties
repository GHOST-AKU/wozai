androidHelpBody=LAN：両方のデバイスを同じ Wi-Fi またはアクセスポイントに接続してください。受信を有効にして検索するか、IP アドレスとポートを入力します。LAN のメッセージは平文で送信されるため、信頼できるネットワークを使用してください。\n\nBluetooth：相手が受信と検出を有効にしてから検索してください。初回の接続では、システムの指示に従ってペアリングします。登録済みのデバイスは、相手が Bluetooth と受信を有効にしていれば、履歴から再接続できます。\n\n初回のチャットでは、デバイスを登録するか、今回のみ許可できます。再接続時は同じデバイス識別情報か確認します。設定で信頼を解除できます。\n\n「確認待ち」は保存確認がまだ届いていない状態、「配信済み」は相手が保存した状態、「未確認」は結果が不明な状態です。いずれも既読を意味しません。\n\n履歴はこのデバイスに保存されます。チャットの切り替えや画面の再作成では下書きを保持しますが、アプリ停止後は失われる場合があります。システムがアプリを停止した場合は、受信を再び有効にしてください。
androidIdentityChanged=このデバイスの識別鍵が変わっています。再び信頼する場合は、設定で信頼を解除してから再接続してください。
