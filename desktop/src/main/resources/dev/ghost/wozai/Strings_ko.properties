help=사용 안내
helpBodyLinux=LAN: 두 기기를 같은 Wi-Fi 또는 핫스팟에 연결하세요. 수신을 켜고 검색하거나 전체 IP 주소와 포트를 입력하세요. 채팅과 파일 전송은 종단간 암호화됩니다. 이 기기의 기록과 첨부 파일은 암호화되지 않습니다.\n\nBluetooth: 어댑터와 BlueZ 시스템 서비스를 켜세요. 양쪽에서 수신을 켜고 검색되는 기기를 검색 가능하게 설정하세요. 처음 페어링할 때는 데스크톱 페어링 에이전트가 필요합니다. 시스템 설정에서 페어링할 수 있습니다. 목록에 페어링된 기기와 검색 결과가 표시됩니다. 기억한 기기는 기록에서 다시 연결할 수 있습니다. 수신을 중지해도 연결된 채팅은 유지됩니다.\n\n처음 채팅할 때 기기를 기억하거나 이번만 허용할 수 있습니다. 시스템 페어링만으로 앱의 신뢰가 부여되지는 않습니다. 다시 연결할 때 같은 공개 키를 확인합니다. 설정에서 신뢰를 취소할 수 있습니다.\n\n확인 대기는 저장 확인이 아직 도착하지 않은 상태, 전달됨은 상대가 저장한 상태, 확인 안 됨은 결과를 모르는 상태입니다. 모두 읽음을 뜻하지 않습니다.\n\n기록과 초안은 다시 시작해도 유지됩니다. 종료한 후에는 수신을 다시 켜세요. 데이터는 XDG_DATA_HOME/wozai에 저장되며 기본값은 ~/.local/share/wozai입니다. 앱 설치 위치와 무관합니다. 개인 키는 추가 암호화 없이 소유자만 접근할 수 있는 파일 권한으로 보호합니다. 데이터를 삭제하면 기록과 신뢰도 삭제됩니다.
helpBodyWindows=LAN: 두 기기를 같은 Wi-Fi 또는 핫스팟에 연결하세요. 수신을 켜고 검색하거나 전체 IP 주소와 포트를 입력하세요. 채팅과 파일 전송은 종단간 암호화됩니다. 이 기기의 기록과 첨부 파일은 암호화되지 않습니다.\n\n블루투스: 상대가 수신과 검색 허용을 켠 후 검색하세요. 처음 연결할 때 시스템 안내에 따라 페어링하고, 필요하면 Windows 블루투스 설정을 사용하세요. 기억한 기기는 상대의 블루투스와 수신이 켜져 있으면 채팅 기록에서 다시 연결할 수 있습니다.\n\n첫 채팅에서는 기기를 기억하거나 이번만 허용할 수 있습니다. 재연결할 때 같은 기기 식별 정보인지 확인합니다. 설정에서 신뢰를 해제할 수 있습니다.\n\n‘확인 대기’는 아직 저장 확인 응답을 받지 못했다는 뜻입니다. ‘전달됨’은 상대 기기가 메시지를 저장했다는 뜻이며, ‘미확인’은 결과를 알 수 없다는 뜻입니다. 읽음 여부를 나타내지는 않습니다.\n\n기록은 이 컴퓨터에 저장됩니다. Windows의 초안은 채팅을 바꾸거나 다시 시작해도 복원됩니다. 앱 종료 후에는 수신을 다시 켜야 합니다.\n\n포터블 데이터는 앱 옆의 data 폴더에 저장됩니다. 데이터를 이전해도 원본은 유지됩니다. 개인 키는 현재 Windows 사용자로 보호되므로 다른 사용자나 컴퓨터에서는 자동으로 잠금 해제할 수 없습니다. data를 삭제하면 기록과 기기 신뢰도 삭제됩니다.
