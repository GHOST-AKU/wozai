about=NearbyIM 정보
aboutBodyLinux=我在 · NearbyIM\nLinux 미리 보기 버전 {0}\n\n계정 없이 가까운 사람과 나누는 문자 채팅.\n\nLAN 또는 클래식 Bluetooth로 일대일 채팅을 할 수 있습니다. 메시지는 이 컴퓨터에 저장됩니다. 데이터를 삭제하면 기록과 기기 신뢰도 삭제됩니다.
aboutBodyWindows=我在 · NearbyIM\nWindows 미리 보기 버전 {0}\n\n계정 없이 근처 사람과 나누는 텍스트 채팅.\n\nLAN 또는 블루투스로 일대일 채팅을 할 수 있습니다. 메시지는 이 컴퓨터에 저장됩니다. 로컬 데이터를 삭제하면 채팅 기록과 기기 신뢰도 삭제됩니다.
addressCopied=주소를 복사했습니다
allowDiscoverable=120초 동안 검색 허용
androidAboutBody=我在 · NearbyIM\nAndroid {0}\n\nLAN 또는 블루투스로 일대일 채팅을 할 수 있습니다. 메시지는 이 기기에 저장됩니다. 앱을 삭제하거나 앱 데이터를 지우면 기록과 기기 신뢰도 삭제됩니다.
androidAboutSummary=Android · {0}\n계정 없이 근처 사람과 나누는 텍스트 채팅
androidBluetoothConnectFailed=블루투스 연결에 실패했습니다. 상대가 NearbyIM을 설치하고 수신을 켰는지 확인하세요. 두 기기에서 시스템 페어링 요청을 확인해야 합니다.
androidBluetoothHint=상대가 수신과 검색 허용을 켠 후 검색하세요. 처음 연결할 때 시스템에서 페어링을 처리합니다.
androidBluetoothSearchFailed=블루투스 검색에 실패했습니다. 근처 기기 또는 위치 권한을 확인하세요.
androidBluetoothSearchNotStarted=검색을 시작하지 못했습니다. 페어링된 기기를 시도해 보세요. Android 11 이하에서는 시스템 위치도 켜야 합니다.
androidBluetoothUnavailable=이 기기는 블루투스를 지원하지 않습니다. LAN을 사용하세요.
androidComposer=메시지 입력…
androidDirectBody=상대 기기에 표시된 전체 주소와 포트를 입력하세요.
androidHelpBody=LAN: 두 기기를 같은 Wi-Fi 또는 핫스팟에 연결하세요. 수신을 켜고 검색하거나 전체 IP 주소와 포트를 입력하세요. 채팅과 파일 전송은 종단간 암호화됩니다. 이 기기의 기록과 첨부 파일은 암호화되지 않습니다.\n\n블루투스: 상대가 수신과 검색 허용을 켠 후 검색하세요. 처음 연결할 때 시스템 안내에 따라 페어링하세요. 기억한 기기는 상대의 블루투스와 수신이 켜져 있으면 채팅 기록에서 다시 연결할 수 있습니다.\n\n첫 채팅에서는 기기를 기억하거나 이번만 허용할 수 있습니다. 재연결할 때 같은 기기 식별 정보인지 확인합니다. 설정에서 신뢰를 해제할 수 있습니다.\n\n‘확인 대기’는 아직 저장 확인 응답을 받지 못했다는 뜻입니다. ‘전달됨’은 상대 기기가 메시지를 저장했다는 뜻이며, ‘미확인’은 결과를 알 수 없다는 뜻입니다. 읽음 여부를 나타내지는 않습니다.\n\n기록은 이 기기에 저장됩니다. 채팅을 바꾸거나 화면을 다시 만들 때 초안은 유지되지만 앱이 중지되면 사라질 수 있습니다. 시스템이 앱을 중지한 후에는 수신을 다시 켜세요.
androidIdentityChanged=이 기기의 식별 키가 변경되었습니다. 다시 신뢰하려면 설정에서 기기의 신뢰를 해제한 후 다시 연결하세요.
androidLanHint=두 기기를 같은 Wi-Fi 또는 핫스팟에 연결하세요.
androidRequestBody={0} 연결입니다. 이 기기를 기억하면 다음에 다시 연결할 수 있습니다. 기기 정보에서 신뢰를 해제할 수 있습니다.\n\n닉네임은 상대가 직접 입력합니다. 기기 신뢰는 실명을 인증하지 않습니다.
androidRequestLanBody={0} 연결입니다. 이 기기를 기억하면 다음에 다시 연결할 수 있습니다. 기기 정보에서 신뢰를 해제할 수 있습니다.\n\n닉네임은 상대가 직접 입력합니다. 기기 신뢰는 실명을 인증하지 않습니다. 채팅과 파일 전송은 종단간 암호화됩니다. 이 기기의 기록과 첨부 파일은 암호화되지 않습니다.
