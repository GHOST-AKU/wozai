helpBody=LAN: Join the same Wi-Fi or hotspot on both devices. Enable reception and search, or enter the full IP address and port. LAN text is plaintext; use a trusted network.\n\nBluetooth: Enable reception and discoverability on the other device. Follow system pairing prompts on the first connection, using Windows Bluetooth settings if needed. Remembered devices can reconnect from chat history while Bluetooth and reception remain enabled.\n\nFor the first chat, approve and remember the device or allow this time only. Reconnection verifies the same device identity. Revoke trust in Settings.\n\nPending means no storage receipt yet. Delivered means the other device saved the message. Unconfirmed means the result is unknown. These states do not mean read.\n\nHistory stays on this computer. Windows drafts survive conversation changes and restarts. Enable reception again after quitting.\n\nPortable data lives in the data folder beside the app. Migration retains original files. Private identity is protected by the current Windows user and cannot automatically unlock on another user or computer. Deleting data removes history and device trust.
aboutBody=NearbyIM · 我在\nWindows preview 0.2.2\n\nNearby text chat without an account.\n\nChat one to one over LAN or Bluetooth. Messages stay on this computer. Deleting local data removes chat history and device trust.
