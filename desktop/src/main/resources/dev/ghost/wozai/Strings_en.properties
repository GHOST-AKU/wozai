androidHelpBody=LAN: Connect both devices to the same Wi-Fi or hotspot. Enable reception and search, or enter the complete IP address and port. Chat and file transfers are end-to-end encrypted. Local history and attachments are not encrypted.\n\nBluetooth: Search after the other device enables reception and discovery. Follow system pairing prompts on the first connection. Remembered devices can reconnect from chat history while Bluetooth and reception remain enabled on the other device.\n\nFor the first chat, remember the device or allow this time only. Reconnection verifies the same device identity. Revoke trust in Settings.\n\nPending means no storage receipt has arrived. Delivered means the other device saved the message. Unconfirmed means the result is unknown. These states do not mean read.\n\nHistory stays on this device. Drafts are kept when switching chats or rebuilding the interface, but may be lost when the app stops. Enable reception again after the system stops the app.
