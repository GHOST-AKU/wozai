help=How to use
helpBodyLinux=LAN: Join the same Wi-Fi or hotspot. Enable reception and search, or enter the complete IP address and port. Chat and file transfers are end-to-end encrypted. Local history and attachments are not encrypted.\n\nBluetooth: Enable the adapter and the BlueZ system service. Enable reception on both devices and discoverability on the device being searched. Use system Bluetooth settings for pairing; a running desktop pairing agent is required for new devices. Paired devices and nearby search results appear in the list. Remembered devices can reconnect from history. Stopping reception keeps an established chat open.\n\nApprove and remember a device or allow this time only. System pairing alone does not grant app trust. Reconnection verifies the same public key. Revoke trust in Settings.\n\nPending means no storage receipt yet; delivered means the other device saved the message; unconfirmed means the result is unknown. None means read.\n\nHistory and drafts survive restarts. Enable reception again after quitting. Data is stored in XDG_DATA_HOME/wozai, or ~/.local/share/wozai by default, independently of the application folder. Private keys are stored without additional encryption and protected by owner-only file permissions. Deleting data removes history and device trust.
helpBodyWindows=LAN: Join the same Wi-Fi or hotspot on both devices. Enable reception and search, or enter the full IP address and port. Chat and file transfers are end-to-end encrypted. Local history and attachments are not encrypted.\n\nBluetooth: Enable reception and discoverability on the other device. Follow system pairing prompts on the first connection, using Windows Bluetooth settings if needed. Remembered devices can reconnect from chat history while Bluetooth and reception remain enabled.\n\nFor the first chat, approve and remember the device or allow this time only. Reconnection verifies the same device identity. Revoke trust in Settings.\n\nPending means no storage receipt yet. Delivered means the other device saved the message. Unconfirmed means the result is unknown. These states do not mean read.\n\nHistory stays on this computer. Windows drafts survive conversation changes and restarts. Enable reception again after quitting.\n\nPortable data lives in the data folder beside the app. Migration retains original files. Private identity is protected by the current Windows user and cannot automatically unlock on another user or computer. Deleting data removes history and device trust.
