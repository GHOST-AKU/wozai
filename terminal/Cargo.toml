[package]
name = "nearbyim-terminal"
version = "0.3.3-preview.2"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Independent NIM4 terminal client for NearbyIM"

[[bin]]
name = "nearbyim"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.28"
ctrlc = "3"
dirs = "6"
fs2 = "0.4"
hex = "0.4"
if-addrs = "0.14"
mdns-sd = "0.15"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["risky-raw-split", "use-aes-gcm", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
flate2 = "1.1"
crc32fast = "1.5"
qrcode = { version = "0.14.1", default-features = false }
rqrr = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[target.'cfg(unix)'.dependencies]
libc = "0.2"
